    - '### Workflow feedback'
    - '`UserView`: Cloud FTP uses `UserView` enum on `GetUser`. The default view is `USER_VIEW_BASIC`, which excludes `user_credentials` and `storage_directory_mappings`. Requesting `USER_VIEW_FULL` in `Find` and post-LRO in `Create`/`Update` is required to avoid missing fields and infinite diff loops.'
    - '`StorageDirectoryMapping.bucket`: Cloud FTP expects just the bucket name, not `projects/{project}/buckets/{bucket}`. A custom mapper trims the resource path prefix when converting `bucketRef.External`.'
    - '`UserCredential.ssh_public_key_body`: GCP Cloud FTP strips trailing comments (e.g. `user@host`) from OpenSSH public keys. A `normalizeUser` callback for `CompareGreenfieldSpecAndLabels` strips trailing comments so desired and actual match without re-reconciliation diffs.'
